Description: "Laboratorio IA generativa en AWS: Parcero, agente Strands en AgentCore Runtime con RAG, DynamoDB y frontend React + Cognito"
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Tu usuario
        Parameters:
          - CorreoUsuario
          - UsuarioDemo
      - Label:
          default: Opciones
        Parameters:
          - ModeloId
          - PrefijoDominio
          - Version
          - CodigoFuente
Parameters:
  CorreoUsuario:
    Type: String
    AllowedPattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
    ConstraintDescription: Debe ser un correo válido.
    Description: Tu correo. Cognito te envía ahí la contraseña temporal y el enlace de la aplicación.
  UsuarioDemo:
    Type: String
    Default: camilo
    AllowedPattern: ^[a-z0-9_-]{3,30}$
    ConstraintDescription: "Entre 3 y 30 caracteres: minúsculas, números, - o _."
    Description: Usuario para iniciar sesión. El álbum de ejemplo se carga a su nombre.
  ModeloId:
    Type: String
    Default: global.amazon.nova-2-lite-v1:0
    Description: Modelo o perfil de inferencia de Bedrock para el agente (debe tener acceso habilitado).
  PrefijoDominio:
    Type: String
    Default: mundial
    AllowedPattern: ^[a-z0-9-]{3,30}$
    ConstraintDescription: "Entre 3 y 30 caracteres: minúsculas, números o -."
    Description: Prefijo del dominio de inicio de sesión de Cognito (se le agrega el ID de la cuenta).
  Version:
    Type: String
    Default: "1"
    Description: Cámbialo (2, 3...) para volver a construir el agente y el frontend con el código actual.
  CodigoFuente:
    Type: String
    Default: https://github.com/Cerozob/generativeai-luisamigo/archive/refs/heads/main.zip
    AllowedPattern: ^https://.+
    ConstraintDescription: Debe ser una URL https.
    Description: URL https del zip del laboratorio (por ejemplo, el zip de GitHub).
