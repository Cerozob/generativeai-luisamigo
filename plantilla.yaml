  ConstruccionProyecto05972599:
    Type: AWS::CodeBuild::Project
    Properties:
      Artifacts:
        Type: NO_ARTIFACTS
      Cache:
        Type: NO_CACHE
      Description: Empaqueta el agente y publica el frontend y los datos del laboratorio
      EncryptionKey: alias/aws/s3
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        ImagePullCredentialsType: CODEBUILD
        PrivilegedMode: false
        Type: LINUX_CONTAINER
      ServiceRole:
        Fn::GetAtt:
          - ConstruccionProyectoRoleAA7C6D96
          - Arn
      Source:
        BuildSpec: |-
          {
            "version": "0.2",
            "phases": {
              "install": {
                "runtime-versions": {
                  "nodejs": "22",
                  "python": "3.13"
                }
              },
              "build": {
                "commands": [
                  "mkdir -p /tmp/lab && cd /tmp/lab",
                  "case \"$CODIGO_FUENTE\" in s3://*) aws s3 cp \"$CODIGO_FUENTE\" codigo.zip ;; *) curl -fsSL \"$CODIGO_FUENTE\" -o codigo.zip ;; esac",
                  "unzip -q codigo.zip -d codigo",
                  "cd \"$(dirname \"$(find codigo -maxdepth 5 -name construir.sh -path \"*/scripts/*\" | head -1)\")/..\"",
                  "bash scripts/construir.sh \"$ETAPA\""
                ]
              }
            }
          }
        Type: NO_SOURCE
      TimeoutInMinutes: 20
